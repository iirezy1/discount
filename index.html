<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VIP STORE | سلة بأيقونة</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            color: #eef;
            font-family: 'Segoe UI', 'Tahoma', system-ui;
            padding: 0 0 40px 0;
        }

        /* شريط علوي */
        .top-bar {
            background: #0d121fcc;
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252e42;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h2 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .cart-icon {
            position: relative;
            cursor: pointer;
            background: #1e2538;
            padding: 8px 16px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .cart-icon:hover {
            background: #2a3456;
        }
        .cart-icon span {
            font-size: 1.3rem;
        }
        .cart-count {
            background: #f5b042;
            color: #0a0f1e;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* نافذة السلة المنبثقة */
        .cart-dropdown {
            position: absolute;
            left: 20px;
            top: 70px;
            background: #0f1424;
            border-radius: 24px;
            width: 340px;
            max-width: calc(100vw - 40px);
            padding: 16px;
            border: 1px solid #2a3456;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200;
            backdrop-filter: blur(10px);
            display: none;
        }
        .cart-dropdown h4 {
            margin-bottom: 12px;
            border-right: 3px solid #ffd966;
            padding-right: 8px;
        }
        .cart-dropdown-items {
            max-height: 350px;
            overflow-y: auto;
        }
        .cart-item-mini {
            background: #0a0f18;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }
        .cart-item-mini .name {
            font-weight: bold;
            color: #ffd966;
        }
        .cart-item-mini .controls {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .cart-item-mini button {
            background: #2a3456;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .cart-item-mini .remove-mini {
            background: #8b3a3a;
        }
        .cart-item-mini input {
            width: 50px;
            text-align: center;
            background: #1e253c;
            border: none;
            padding: 4px;
            border-radius: 30px;
            color: white;
        }
        .cart-dropdown-total {
            text-align: center;
            font-size: 1.2rem;
            margin: 12px 0;
            border-top: 1px solid #2a3456;
            padding-top: 8px;
        }
        .cart-dropdown button {
            width: 100%;
            background: #f5b042;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
        }
        .clear-cart-btn {
            background: #555 !important;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .eid {
            background: linear-gradient(135deg, #1e4a2f, #0f2e1e);
            text-align: center;
            padding: 14px;
            border-radius: 48px;
            margin-bottom: 24px;
            border: 1px solid #ffd96688;
        }
        .eid h2 {
            color: #ffd966;
            font-size: 1.3rem;
        }

        .main-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-title h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }
        .product-card {
            background: #11161f;
            border-radius: 24px;
            padding: 14px;
            border: 1px solid #252e42;
            transition: 0.2s;
        }
        .product-card:hover {
            border-color: #ffd966;
        }
        .product-name {
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 6px;
        }
        .product-price {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 6px 0;
        }
        .product-gift {
            background: #1e2538;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #ffbe76;
            margin: 8px 0;
        }
        .add-btn {
            background: #2a9d8f;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .invoice-area {
            margin-top: 30px;
            background: #0d121f;
            border-radius: 28px;
            padding: 20px;
            display: none;
        }
        .invoice-box {
            background: #06090f;
            padding: 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            border-right: 4px solid #ffd966;
            max-height: 350px;
            overflow: auto;
        }
        .invoice-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .invoice-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .copy-btn { background: #4a6fa5; color: white; }
        .whatsapp-btn { background: #25D366; color: white; }
        .telegram-btn { background: #0088cc; color: white; }
        .image-btn { background: #e67e22; color: white; }
        .email-btn { background: #3b5998; color: white; }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #6c7a9e;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="logo"><h2>VIP STORE</h2></div>
    <div class="cart-icon" id="cartIcon">
        <span>🛒</span>
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<!-- نافذة السلة -->
<div class="cart-dropdown" id="cartDropdown">
    <h4>🛍️ سلة التسوق</h4>
    <div id="cartDropdownItems" class="cart-dropdown-items">السلة فارغة</div>
    <div id="cartDropdownTotal" class="cart-dropdown-total">الإجمالي: 0 د.ع</div>
    <button onclick="generateInvoiceFromCart()">🧾 عمل فاتورة</button>
    <button class="clear-cart-btn" onclick="clearCartAndClose()">🗑️ تفريغ السلة</button>
</div>

<div class="container">
    <div class="eid">
        <h2>🌙 كل عام وأنتم بخير 🌙</h2>
        <p>عروض العيد .. أضف إلى السلة وأنشئ فاتورة فورية</p>
    </div>
    <div class="main-title">
        <h1>أرخص الأسعار + هدايا مجانية</h1>
        <p>اختر عرضك ➕ سلة في الأعلى</p>
    </div>
    <div class="products-grid" id="productsGrid"></div>

    <div class="invoice-area" id="invoiceArea">
        <h3>📄 فاتورة الطلب</h3>
        <div class="invoice-box" id="invoiceText"></div>
        <div class="invoice-buttons">
            <button class="copy-btn" onclick="copyInvoice()">📋 نسخ</button>
            <button class="whatsapp-btn" onclick="sendWhatsApp()">💬 واتساب</button>
            <button class="telegram-btn" onclick="sendTelegram()">📨 تيليجرام</button>
            <button class="image-btn" onclick="saveInvoiceAsImage()">🖼️ حفظ كصورة</button>
            <button class="email-btn" onclick="sendEmail()">📧 إيميل</button>
            <button onclick="closeInvoice()">❌ إغلاق</button>
        </div>
    </div>
    <footer>🔒 فاتورة رسمية | أرسلها لأي منصة | حفظ كصورة وإرسال بالبريد</footer>
</div>

<script>
    const productsList = [
        { id: 1, name: "رانك أساسي (1690+990 كوينز)", price: 5000, gift: "بدون هدية" },
        { id: 2, name: "عرض المطور (رانكين + حزمتين)", price: 10000, gift: "هدية اكسسوار أو يوزر رباعي" },
        { id: 3, name: "تغيير اسم + يوزر رباعي", price: 7000, gift: "300 كوينز إضافية" },
        { id: 4, name: "اكسسوار نادر", price: 3000, gift: "يوزر نادر مع حزمتين" },
        { id: 5, name: "تغيير اسم + يوزر رباعي + رانك", price: 13000, gift: "شامل كل شيء" },
        { id: 6, name: "5 حزم = السادسة مجاناً", price: 10000, gift: "حزمة 6 + هدية" },
        { id: 7, name: "VIP 30 + رانك قولد 90 يوم", price: 50000, gift: "حزمتين قفت هدية " },
        { id: 8, name: "Birthday Bundle + رانكين", price: 12000, gift: "هدية مفاجئة" },
        { id: 9, name: "10 حزم 990 كوينز", price: 20000, gift: "حزمتين مجاناً" },
        { id: 10, name: "4 حزم 4280 كوينز", price: 40000, gift: "حزمتين 990 + اكسسوار" },
        { id: 11, name: "5 رانكات + السادس مجاناً", price: 18000, gift: "رانك مجاني" },
        { id: 12, name: "VIP 15 + يوزر رباعي", price: 25000, gift: "يوزر رباعي نادر" },
        { id: 13, name: "VIP 15 + رانكين هدية", price: 23000, gift: "رانكين مجاناً" },
        { id: 14, name: "6 رانكات + السابع مجاناً", price: 18000, gift: "رانك مجاني" },
        { id: 15, name: "عرض العيد (5 رانكات)", price: 18000, gift: "رانك مجاني هدية العيد" }
    ];

    let cart = [];

    const productsGrid = document.getElementById("productsGrid");
    productsList.forEach(p => {
        let card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString()} د.ع</div>
            <div class="product-gift">🎁 ${p.gift}</div>
            <button class="add-btn" onclick="addToCart(${p.id})">➕ أضف إلى السلة</button>
        `;
        productsGrid.appendChild(card);
    });

    function addToCart(id) {
        let product = productsList.find(p => p.id === id);
        let existing = cart.find(i => i.id === id);
        if (existing) existing.quantity++;
        else cart.push({ ...product, quantity: 1 });
        updateCartUI();
        showCartDropdownTemporarily();
    }

    function updateCartUI() {
        let total = 0, count = 0;
        let html = "";
        cart.forEach((item, idx) => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;
            count += item.quantity;
            html += `
                <div class="cart-item-mini">
                    <div class="name">${item.name}</div>
                    <div>${item.price.toLocaleString()} د.ع × ${item.quantity}</div>
                    <div class="controls">
                        <button onclick="changeQty(${idx}, -1)">-</button>
                        <input type="number" id="qty-${idx}" value="${item.quantity}" min="1" onchange="setQty(${idx}, this.value)">
                        <button onclick="changeQty(${idx}, 1)">+</button>
                        <button class="remove-mini" onclick="removeItem(${idx})">حذف</button>
                    </div>
                    <div>المجموع: ${itemTotal.toLocaleString()} د.ع</div>
                </div>
            `;
        });
        if (cart.length === 0) html = "<div>السلة فارغة 🛒</div>";
        document.getElementById("cartDropdownItems").innerHTML = html;
        document.getElementById("cartDropdownTotal").innerHTML = `💰 الإجمالي: ${total.toLocaleString()} د.ع`;
        document.getElementById("cartCount").innerText = count;
    }

    function changeQty(idx, delta) {
        let newQty = cart[idx].quantity + delta;
        if (newQty >= 1) cart[idx].quantity = newQty;
        else cart.splice(idx, 1);
        updateCartUI();
    }
    function setQty(idx, val) { let qty = parseInt(val); if (isNaN(qty) || qty < 1) qty = 1; cart[idx].quantity = qty; updateCartUI(); }
    function removeItem(idx) { cart.splice(idx, 1); updateCartUI(); }
    function clearCartAndClose() { cart = []; updateCartUI(); document.getElementById("cartDropdown").style.display = "none"; }

    function showCartDropdownTemporarily() {
        let dropdown = document.getElementById("cartDropdown");
        dropdown.style.display = "block";
        setTimeout(() => { if (!dropdown.matches(':hover')) dropdown.style.display = "none"; }, 3000);
    }
    document.getElementById("cartIcon").onclick = () => {
        let d = document.getElementById("cartDropdown");
        d.style.display = d.style.display === "block" ? "none" : "block";
    };
    document.addEventListener("click", function(e) {
        if (!document.getElementById("cartIcon").contains(e.target) && !document.getElementById("cartDropdown").contains(e.target))
            document.getElementById("cartDropdown").style.display = "none";
    });

    function generateInvoiceFromCart() {
        if (cart.length === 0) { alert("⚠️ السلة فارغة!"); return; }
        let invoiceNum = "INV-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
        let date = new Date().toLocaleString("ar-EG");
        let total = 0, itemsText = "";
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;
            itemsText += `• ${item.name} × ${item.quantity} = ${itemTotal.toLocaleString()} د.ع\n   🎁 ${item.gift}\n`;
        });
        let invoice = `╔════════════════════════════════════════╗\n║            VIP STORE - فاتورة            ║\n╠════════════════════════════════════════╣\n📄 رقم الفاتورة: ${invoiceNum}\n📅 التاريخ: ${date}\n────────────────────────────────────────\n🛍️ المنتجات:\n${itemsText}\n────────────────────────────────────────\n💰 الإجمالي النهائي: ${total.toLocaleString()} د.ع\n────────────────────────────────────────\n⭐ كل عام وأنتم بخير 🌙\n╚════════════════════════════════════════╝`;
        document.getElementById("invoiceText").innerText = invoice;
        document.getElementById("invoiceArea").style.display = "block";
        window.lastInvoice = invoice;
        window.lastInvoiceNum = invoiceNum;
    }
    function closeInvoice() { document.getElementById("invoiceArea").style.display = "none"; }
    function copyInvoice() { if (!window.lastInvoice) { alert("أنشئ فاتورة أولاً"); return; } navigator.clipboard.writeText(window.lastInvoice); alert("✅ تم النسخ"); }
    function sendWhatsApp() { if (!window.lastInvoice) return; let phone = prompt("رقم واتساب:", "7700000000"); if(phone) window.open(`https://wa.me/${phone}?text=${encodeURIComponent(window.lastInvoice)}`); }
    function sendTelegram() { copyInvoice(); alert("افتح تيليجرام وألصق"); window.open("https://t.me/"); }
    async function saveInvoiceAsImage() { let el = document.getElementById("invoiceText"); if(!el.innerText.trim()) return; let canvas = await html2canvas(el, { scale: 2, backgroundColor: "#06090f" }); let link = document.createElement("a"); link.download = `فاتورة_${Date.now()}.png`; link.href = canvas.toDataURL(); link.click(); alert("✅ تم حفظ الصورة"); }
    function sendEmail() { if(!window.lastInvoice) return; let email = prompt("البريد الإلكتروني:"); if(email) window.location.href = `mailto:${email}?subject=فاتورة ${window.lastInvoiceNum}&body=${encodeURIComponent(window.lastInvoice)}`; alert("📧 تم فتح البريد"); }
</script>
</body>
</html>
